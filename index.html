<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('galaxy', {
        schema: { count: {type: 'int', default: 10000} },
        init: function () {
          const points = new Float32Array(this.data.count * 3);
          const colors = new Float32Array(this.data.count * 3);
          
          for (let i = 0; i < this.data.count; i++) {
            // Spiral Math
            const i3 = i * 3;
            const radius = Math.random() * 10;
            const spin = 2.5;
            const branchAngle = (i % 3) * ((Math.PI * 2) / 3);
            const randomX = (Math.random() - 0.5) * 0.5 * radius;
            const randomY = (Math.random() - 0.5) * 0.3;
            const randomZ = (Math.random() - 0.5) * 0.5 * radius;

            points[i3] = Math.cos(radius * spin + branchAngle) * radius + randomX;
            points[i3 + 1] = randomY; // Flat galaxy
            points[i3 + 2] = Math.sin(radius * spin + branchAngle) * radius + randomZ;

            // Coloring: Bright center (white/blue), red edges
            colors[i3] = 1 - (radius / 10); // Red
            colors[i3 + 1] = 0.5 + (Math.random() * 0.5); // Green
            colors[i3 + 2] = 1; // Blue
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(points, 3));
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

          const material = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
          });

          this.el.setObject3D('mesh', new THREE.Points(geometry, material));
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #000">
      <a-entity galaxy="count: 15000" position="0 1.6 0" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 50000; easing: linear">
      </a-entity>

      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-cursor color="white"></a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
