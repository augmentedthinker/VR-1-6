<!DOCTYPE html>
<html>
  <head>
    <title>Dual World VR Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      // 1. TEXTURE GENERATOR
      // Creates a "Comet" texture on the fly for the trails
      function createCometTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        
        // Draw a glowing sphere with a trail
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(0, 255, 255, 0.8)');
        gradient.addColorStop(0.5, 'rgba(0, 0, 100, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,64,64);
        
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
      }

      // 2. GALAXY COMPONENT (Inner World)
      AFRAME.registerComponent('galaxy-boundary', {
        init: function () {
          const count = 5000;
          const geometry = new THREE.BufferGeometry();
          const positions = [];
          const colors = [];
          const randomness = [];

          const colorInside = new THREE.Color(0xff00aa); // Pink/Purple center
          const colorOutside = new THREE.Color(0x00ffff); // Cyan edges

          for (let i = 0; i < count; i++) {
            // Spiral distribution
            const r = Math.random() * 1.5; // Radius (keep somewhat small to fit mostly in sphere)
            const theta = Math.random() * Math.PI * 2;
            
            // Initial Positions
            const x = r * Math.cos(theta);
            const y = (Math.random() - 0.5) * 0.5; // Flattened disc
            const z = r * Math.sin(theta);

            positions.push(x, y, z);

            // Mix colors
            const mixedColor = colorInside.clone().lerp(colorOutside, r);
            colors.push(mixedColor.r, mixedColor.g, mixedColor.b);

            // Random speed/offset for animation
            randomness.push(Math.random(), Math.random(), Math.random());
          }

          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          geometry.setAttribute('aRandom', new THREE.Float32BufferAttribute(randomness, 3));

          // CUSTOM SHADER MATERIAL
          const material = new THREE.ShaderMaterial({
            uniforms: {
              uTime: { value: 0 },
              uTexture: { value: createCometTexture() }
            },
            vertexShader: `
              uniform float uTime;
              attribute vec3 aRandom;
              attribute vec3 color;
              varying vec3 vColor;
              varying vec3 vPos;
              
              void main() {
                vColor = color;
                
                // Animate: Swirl around Y axis
                float speed = 0.5 + aRandom.x;
                float angle = uTime * speed + length(position.xz) * 2.0;
                
                vec3 transformed = position;
                
                // Rotation Matrix logic
                float c = cos(angle);
                float s = sin(angle);
                
                // Rotate around center
                float nx = transformed.x * c - transformed.z * s;
                float nz = transformed.x * s + transformed.z * c;
                
                transformed.x = nx;
                transformed.z = nz;

                // Add slight bobbing
                transformed.y += sin(uTime * 2.0 + aRandom.y * 10.0) * 0.05;

                vPos = transformed; // Send world position to fragment shader
                
                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);
                gl_PointSize = (10.0 / -mvPosition.z); // Size attenuation
                gl_Position = projectionMatrix * mvPosition;
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              varying vec3 vColor;
              varying vec3 vPos;

              void main() {
                // THE BOUNDARY LOGIC
                // Calculate distance from center (0,0,0)
                float dist = length(vPos);

                // If we are OUTSIDE the 1m sphere, make invisible (discard pixel)
                if (dist > 1.0) discard;

                // Soft fade at the edge (0.9 to 1.0)
                float alpha = 1.0 - smoothstep(0.9, 1.0, dist);

                vec4 tex = texture2D(uTexture, gl_PointCoord);
                gl_FragColor = vec4(vColor, 1.0) * tex;
                gl_FragColor.a *= alpha; 
              }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });

          this.mesh = new THREE.Points(geometry, material);
          this.el.setObject3D('mesh', this.mesh);
        },
        tick: function (time, timeDelta) {
          if (this.mesh) {
            this.mesh.material.uniforms.uTime.value = time / 1000;
          }
        }
      });

      // 3. OUTER WORLD COMPONENT
      AFRAME.registerComponent('outer-world', {
        init: function() {
          const geometry = new THREE.IcosahedronGeometry(15, 2); // Big wireframe sphere
          
          const material = new THREE.ShaderMaterial({
            uniforms: {},
            vertexShader: `
              varying vec3 vPos;
              void main() {
                vPos = position; 
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              varying vec3 vPos;
              void main() {
                // THE BOUNDARY LOGIC (INVERTED)
                float dist = length(vPos);
                
                // If we are INSIDE the 1m sphere, hide this world
                if (dist < 1.0) discard;

                // Neon Grid look
                gl_FragColor = vec4(0.0, 1.0, 0.2, 0.3); 
              }
            `,
            wireframe: true,
            side: THREE.BackSide,
            transparent: true
          });

          this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #050505">
      
      <!-- ENVIRONMENT SETUP -->
      <!-- A faint ambient light -->
      <a-light type="ambient" intensity="0.5"></a-light>
      
      <!-- THE INNER GALAXY -->
      <!-- This system handles the swirling particles inside 1m -->
      <a-entity galaxy-boundary position="0 0 0"></a-entity>

      <!-- THE OUTER WORLD -->
      <!-- A large wireframe structure representing the 'other' dimension -->
      <a-entity outer-world position="0 0 0"></a-entity>

      <!-- Some visual markers for the outer world to make it obvious -->
      <!-- These boxes only appear if you are far enough away due to the clip-material component -->
      <a-box position="-3 1 -3" color="orange" width="1" height="4" depth="1"></a-box>
      <a-box position="3 1 -3" color="orange" width="1" height="4" depth="1"></a-box>
      <a-box position="0 4 -5" color="purple" width="8" height="1" depth="1"></a-box>
      
      <!-- The Boundary Marker (Visual ring at 1m radius) -->
      <a-ring radius-inner="0.98" radius-outer="1.0" rotation="-90 0 0" color="white" opacity="0.5"></a-ring>

      <!-- CAMERA / PLAYER -->
      <!-- Moved camera to 0, 1.6, 0 (standard eye height) -->
      <a-entity id="rig" position="0 0 0">
        <a-entity camera look-controls wasd-controls position="0 1.6 0">
            <a-cursor color="white" opacity="0.5"></a-cursor>
        </a-entity>
        <!-- Hands for VR -->
        <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
