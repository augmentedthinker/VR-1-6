<!DOCTYPE html>
<html>
  <head>
    <title>Dual World VR Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 0, 16, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #00ffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
      }
      #start-btn {
        padding: 15px 40px;
        font-size: 1.5rem;
        background: transparent;
        border: 2px solid #ff00ff;
        color: #ff00ff;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 20px;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      #start-btn:hover {
        background: #ff00ff;
        color: white;
        box-shadow: 0 0 20px #ff00ff;
      }
    </style>
    <script>
      const apiKey = ""; // Environment provides the key at runtime
      let audioUnlocked = false;

      // Helper: Convert PCM16 to WAV for playback
      function pcmToWav(pcmData, sampleRate) {
        const header = new ArrayBuffer(44);
        const view = new DataView(header);
        const dataLength = pcmData.byteLength;

        view.setUint32(0, 0x52494646, false); // "RIFF"
        view.setUint32(4, 36 + dataLength, true);
        view.setUint32(8, 0x57415645, false); // "WAVE"
        view.setUint32(12, 0x666d7420, false); // "fmt "
        view.setUint32(16, 16, true); 
        view.setUint16(20, 1, true); 
        view.setUint16(22, 1, true); 
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true); 
        view.setUint16(32, 2, true); 
        view.setUint16(34, 16, true); 
        view.setUint32(36, 0x64617461, false); // "data"
        view.setUint32(40, dataLength, true);

        const blob = new Blob([header, pcmData], { type: 'audio/wav' });
        return URL.createObjectURL(blob);
      }

      function startExperience() {
        audioUnlocked = true;
        document.getElementById('overlay').style.display = 'none';
        // Try to resume any existing AudioContexts if they were suspended
        const scene = document.querySelector('a-scene');
        if (scene && scene.components['tictac-dynamic']) {
            const comp = scene.components['tictac-dynamic'];
            if (comp.audioCtx) comp.audioCtx.resume();
        }
      }

      // 1. TEXTURE GENERATOR
      function createCometTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(0, 255, 255, 0.8)');
        gradient.addColorStop(0.5, 'rgba(0, 100, 255, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,64,64);
        return new THREE.CanvasTexture(canvas);
      }

      // 2. GALAXY COMPONENT
      AFRAME.registerComponent('galaxy-boundary', {
        init: function () {
          const count = 5000;
          const geometry = new THREE.BufferGeometry();
          const positions = []; const colors = []; const randomness = [];
          const colorInside = new THREE.Color(0xff00aa); 
          const colorOutside = new THREE.Color(0x00ffff); 

          for (let i = 0; i < count; i++) {
            const r = Math.random() * 1.5; 
            const theta = Math.random() * Math.PI * 2;
            const x = r * Math.cos(theta);
            const y = (Math.random() - 0.5) * 0.5; 
            const z = r * Math.sin(theta);
            positions.push(x, y, z);
            const mixedColor = colorInside.clone().lerp(colorOutside, r);
            colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
            randomness.push(Math.random(), Math.random(), Math.random());
          }

          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          geometry.setAttribute('aRandom', new THREE.Float32BufferAttribute(randomness, 3));

          const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uTexture: { value: createCometTexture() } },
            vertexShader: `
              uniform float uTime;
              attribute vec3 aRandom;
              attribute vec3 color;
              varying vec3 vColor;
              varying vec3 vPos;
              void main() {
                vColor = color;
                float speed = 0.5 + aRandom.x;
                float angle = uTime * speed + length(position.xz) * 2.0;
                vec3 transformed = position;
                float c = cos(angle); float s = sin(angle);
                float nx = transformed.x * c - transformed.z * s;
                float nz = transformed.x * s + transformed.z * c;
                transformed.x = nx; transformed.z = nz;
                transformed.y += sin(uTime * 2.0 + aRandom.y * 10.0) * 0.05;
                vPos = transformed; 
                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);
                gl_PointSize = (10.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              varying vec3 vColor;
              varying vec3 vPos;
              void main() {
                float dist = length(vPos);
                if (dist > 1.0) discard;
                float alpha = 1.0 - smoothstep(0.9, 1.0, dist);
                vec4 tex = texture2D(uTexture, gl_PointCoord);
                gl_FragColor = vec4(vColor, 1.0) * tex;
                gl_FragColor.a *= alpha; 
              }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
          });

          this.mesh = new THREE.Points(geometry, material);
          this.el.setObject3D('mesh', this.mesh);
        },
        tick: function (time) {
          if (this.mesh) this.mesh.material.uniforms.uTime.value = time / 1000;
        }
      });

      // 3. SYNTHWAVE GRID
      AFRAME.registerComponent('synth-grid', {
        init: function() {
          const size = 200;
          const divisions = 100;
          const geometry = new THREE.PlaneGeometry(size, size, divisions, divisions);
          const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: `
              varying vec2 vUv;
              varying vec3 vWorldPos;
              void main() {
                vUv = uv;
                vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform float uTime;
              varying vec2 vUv;
              varying vec3 vWorldPos;
              void main() {
                if (length(vWorldPos) < 1.0) discard;
                vec2 gridUv = vUv * 80.0;
                gridUv.y += uTime * 0.5;
                vec2 grid = abs(fract(gridUv - 0.5) - 0.5) / fwidth(gridUv);
                float line = min(grid.x, grid.y);
                float color = 1.0 - min(line, 1.0);
                vec3 neonColor = vec3(0.8, 0.0, 1.0); 
                gl_FragColor = vec4(neonColor * color, color * 0.5);
              }
            `,
            transparent: true, side: THREE.DoubleSide
          });
          this.mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D('mesh', this.mesh);
        },
        tick: function(time) {
          if (this.mesh) this.mesh.material.uniforms.uTime.value = time / 1000;
        }
      });

      // 4. RETRO SUN
      AFRAME.registerComponent('retro-sun', {
        init: function() {
          const geometry = new THREE.CircleGeometry(20, 32);
          const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uPulse: { value: 0 } },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform float uTime;
              uniform float uPulse;
              varying vec2 vUv;
              void main() {
                vec2 uv = vUv * 2.0 - 1.0;
                float d = length(uv);
                if (d > 1.0) discard;
                float stripeFreq = 20.0 + (uPulse * 10.0);
                float stripes = step(0.1, sin(uv.y * stripeFreq - uTime * 2.0));
                vec3 baseColor = mix(vec3(1.0, 0.8, 0.0), vec3(1.0, 0.0, 0.5), uv.y * 0.5 + 0.5);
                vec3 pulseColor = mix(baseColor, vec3(1.0, 1.0, 1.0), uPulse * 0.5);
                float finalAlpha = stripes * (1.0 - smoothstep(0.8, 1.0, d));
                gl_FragColor = vec4(pulseColor, finalAlpha);
              }
            `,
            transparent: true, side: THREE.DoubleSide
          });
          this.mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D('mesh', this.mesh);
          this.isPulsing = false;
          this.pulseVal = 0;
          this.el.addEventListener('sun-pulse-start', () => { this.isPulsing = true; });
          this.el.addEventListener('sun-pulse-stop', () => { this.isPulsing = false; });
        },
        tick: function(time) {
          if (!this.mesh) return;
          this.mesh.material.uniforms.uTime.value = time / 1000;
          if (this.isPulsing) {
            this.pulseVal = (Math.sin(time / 200) * 0.5 + 0.5);
          } else {
            this.pulseVal = THREE.MathUtils.lerp(this.pulseVal, 0, 0.05);
          }
          this.mesh.material.uniforms.uPulse.value = this.pulseVal;
        }
      });

      // 5. PULSE EFFECT
      AFRAME.registerComponent('vibrant-pulse', {
        schema: { color: {default: '#00ffff'} },
        init: function() {
          this.el.setAttribute('geometry', {primitive: 'ring', radiusInner: 0.1, radiusOuter: 0.2});
          this.el.setAttribute('material', {color: this.data.color, shader: 'flat', transparent: true, opacity: 1, side: 'double'});
          this.el.setAttribute('rotation', {x: -90, y: 0, z: 0});
          this.scale = 0.1;
        },
        tick: function(time, delta) {
          this.scale += delta / 80; 
          this.el.setAttribute('scale', {x: this.scale, y: this.scale, z: 1});
          const opacity = 1 - (this.scale / 30);
          this.el.setAttribute('material', 'opacity', opacity);
          if (opacity <= 0) {
            this.el.parentNode.removeChild(this.el);
          }
        }
      });

      // 6. CONTINUITY DYNAMIC TIC TAC
      AFRAME.registerComponent('tictac-dynamic', {
        init: function() {
          const geometry = new THREE.CapsuleGeometry(0.3, 1, 12, 12);
          const material = new THREE.MeshStandardMaterial({
            color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.8,
            roughness: 0, metalness: 1, transparent: true, opacity: 1
          });
          this.mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D('mesh', this.mesh);
          
          this.targetPos = new THREE.Vector3();
          this.currentPos = new THREE.Vector3(20, 10, -40);
          this.state = 'hover'; 
          this.stateTimer = 0;
          this.isSpeaking = false;
          this.lastSpeakTime = 0;
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          
          this.mountains = [
            {x: 0, y: 5, z: -35}, {x: -15, y: 8, z: -30}, {x: -28, y: 12, z: -45},
            {x: -45, y: 18, z: -55}, {x: 15, y: 6, z: -30}, {x: 30, y: 15, z: -48},
            {x: 50, y: 12, z: -52}
          ];
          this.sunPos = new THREE.Vector3(0, 10, -50);
          this.pickNewTarget();
        },

        async speak() {
          if (!audioUnlocked) return;
          if (this.isSpeaking || Date.now() - this.lastSpeakTime < 15000) return;
          this.isSpeaking = true;
          this.lastSpeakTime = Date.now();

          const prompt = "The craft is an advanced sentient observer. Say a cryptic, one-sentence observation about the observer's reality in a deep, resonant, robotic whisper.";

          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } }
                  }
                }
              })
            });

            if (!response.ok) throw new Error('API request failed');
            const result = await response.json();
            const audioData = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            const mimeType = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.mimeType || "audio/L16;rate=24000";
            const sampleRate = parseInt(mimeType.split('rate=')[1]) || 24000;

            if (audioData) {
              const binaryString = atob(audioData);
              const bytes = new Uint8Array(binaryString.length);
              for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
              
              const audioUrl = pcmToWav(bytes.buffer, sampleRate);
              const audio = new Audio(audioUrl);
              audio.volume = 0.7;
              
              // Ensure AudioContext is resumed before playing
              if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
              
              audio.play().catch(e => console.warn("Playback blocked:", e));
              audio.onended = () => { this.isSpeaking = false; };
            }
          } catch (error) {
            console.error('Speech error:', error);
            this.isSpeaking = false;
          }
        },

        playSynth: function(freq, duration) {
          if (!audioUnlocked) return;
          try {
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.2, this.audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start();
            osc.stop(this.audioCtx.currentTime + duration);
          } catch(e) {}
        },

        pickSurfacePos: function() {
            const roll = Math.random();
            if (roll > 0.7) return this.sunPos.clone();
            if (roll > 0.4) return new THREE.Vector3((Math.random() - 0.5) * 40, -1, -5 - Math.random() * 20);
            const m = this.mountains[Math.floor(Math.random() * this.mountains.length)];
            return new THREE.Vector3(m.x, m.y, m.z);
        },

        pickNewTarget: function() {
          const roll = Math.random();
          if (roll < 0.15) {
            this.state = 'glide';
            this.targetPos.set((Math.random() - 0.5) * 6, 1.6, 1.5); 
          } else if (roll < 0.5) {
            this.state = 'diving';
            this.targetPos.copy(this.pickSurfacePos());
          } else {
            this.state = 'dash';
            this.targetPos.set((Math.random() - 0.5) * 80, 10 + Math.random() * 15, -20 - Math.random() * 40);
          }
          this.stateTimer = 0;
        },

        createPulse: function(pos) {
          const pulse = document.createElement('a-entity');
          pulse.setAttribute('vibrant-pulse', {color: '#00ffff'});
          pulse.setAttribute('position', pos);
          this.el.sceneEl.appendChild(pulse);
          this.playSynth(180, 2.5);
        },

        tick: function(time, delta) {
          const dt = delta / 1000;
          this.stateTimer += dt;
          const dir = new THREE.Vector3().subVectors(this.targetPos, this.currentPos);
          const dist = dir.length();

          let targetOpacity = 1;
          if (this.state === 'diving' && dist < 12) targetOpacity = Math.max(0, (dist - 1.0) / 11.0);
          else if (this.state === 'hidden') targetOpacity = 0;
          else if (this.state === 'rising') targetOpacity = Math.min(1, this.stateTimer / 2.0);
          this.mesh.material.opacity = THREE.MathUtils.lerp(this.mesh.material.opacity, targetOpacity, 0.05);

          if (this.state === 'glide' && dist < 2.5) {
            this.speak();
          }

          if (this.state === 'dash' || this.state === 'glide' || this.state === 'diving') {
            if (dist < 0.5) {
              if (this.state === 'diving') {
                this.createPulse(this.currentPos.clone());
                if (this.targetPos.distanceTo(this.sunPos) < 1) {
                  const sunEl = document.querySelector('#the-sun');
                  if (sunEl) sunEl.emit('sun-pulse-start');
                  this.wasInSun = true;
                }
                this.state = 'hidden';
                this.stateTimer = 0;
              } else {
                this.state = 'hover';
                this.stateTimer = 0;
              }
            } else {
              dir.normalize();
              const speed = (this.state === 'glide') ? 12.0 : 25.0;
              this.currentPos.addScaledVector(dir, speed * dt);
              const targetRotation = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
              this.mesh.quaternion.slerp(targetRotation, 0.03);
            }
          } else if (this.state === 'hidden') {
            if (this.stateTimer > 4.0) {
                if (this.wasInSun) {
                  const sunEl = document.querySelector('#the-sun');
                  if (sunEl) sunEl.emit('sun-pulse-stop');
                  this.wasInSun = false;
                }
                this.currentPos.copy(this.pickSurfacePos());
                this.targetPos.copy(this.currentPos).add(new THREE.Vector3(0, 10, 5));
                this.createPulse(this.currentPos.clone());
                this.state = 'rising';
                this.stateTimer = 0;
            }
          } else if (this.state === 'rising') {
             const riseDir = new THREE.Vector3().subVectors(this.targetPos, this.currentPos).normalize();
             this.currentPos.addScaledVector(riseDir, 5.0 * dt);
             if (this.stateTimer > 2.0) { this.state = 'hover'; this.stateTimer = 0; }
          } else if (this.state === 'hover') {
            this.currentPos.y += Math.sin(time / 500) * 0.005;
            if (this.stateTimer > 2 + Math.random() * 3) this.pickNewTarget();
            const upright = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), Math.PI/2);
            this.mesh.quaternion.slerp(upright, 0.02);
          }

          this.el.setAttribute('position', this.currentPos);
          this.mesh.visible = this.mesh.material.opacity > 0.01;
        }
      });
    </script>
  </head>
  <body>
    <div id="overlay">
      <h1>DUAL WORLD VR</h1>
      <p>Step through the portal. Listen to the observer.</p>
      <button id="start-btn" onclick="startExperience()">Start Experience</button>
    </div>

    <a-scene background="color: #050010">
      <a-light type="ambient" intensity="0.4"></a-light>
      <a-light type="point" position="0 10 0" intensity="1" color="#ff00ff"></a-light>
      
      <a-entity galaxy-boundary position="0 0 0"></a-entity>
      <a-entity synth-grid rotation="-90 0 0" position="0 -1 0"></a-entity>
      <a-entity id="the-sun" retro-sun position="0 10 -50"></a-entity>
      <a-entity tictac-dynamic></a-entity>

      <!-- MOUNTAINS -->
      <a-cone position="0 1 -35" radius-bottom="12" height="10" color="#100020" segments-radial="4"></a-cone>
      <a-cone position="-15 2 -30" radius-bottom="10" height="15" color="#200040" segments-radial="4"></a-cone>
      <a-cone position="-28 3 -45" radius-bottom="15" height="20" color="#150025" segments-radial="4"></a-cone>
      <a-cone position="-45 4 -55" radius-bottom="20" height="30" color="#0a0015" segments-radial="4"></a-cone>
      <a-cone position="-60 2 -40" radius-bottom="12" height="15" color="#1a0033" segments-radial="4"></a-cone>
      <a-cone position="15 1.5 -30" radius-bottom="8" height="12" color="#1a0033" segments-radial="4"></a-cone>
      <a-cone position="30 4 -48" radius-bottom="18" height="25" color="#1a0033" segments-radial="4"></a-cone>
      <a-cone position="50 3 -52" radius-bottom="15" height="20" color="#0a0015" segments-radial="4"></a-cone>
      <a-cone position="65 2 -35" radius-bottom="10" height="12" color="#200040" segments-radial="4"></a-cone>

      <a-ring radius-inner="0.99" radius-outer="1.01" rotation="-90 0 0" color="#ff00ff" opacity="0.8"></a-ring>

      <a-entity id="rig">
        <a-entity camera look-controls wasd-controls position="0 1.6 0">
            <a-cursor color="#00ffff" opacity="0.5"></a-cursor>
        </a-entity>
        <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
